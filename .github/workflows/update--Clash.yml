# 工作流名称，显示在 Actions 页面
name: Update -Clash

# 定义触发条件
on:
  # 允许手动在 GitHub 上触发
  workflow_dispatch:
  # 定时触发：每小时的第12、32、52分运行一次（UTC时间）
  schedule:
    - cron: "12,32,52 * * * *"

# 赋予工作流写入仓库内容的权限（后续需要提交推送）
permissions:
  contents: write

# 并发控制：同一时间只允许一个此工作流运行，新触发会取消正在运行的旧任务
concurrency:
  group: update--Clash
  cancel-in-progress: true

jobs:
  update:                      # 唯一的 job，名称为 update
    runs-on: ubuntu-latest     # 使用最新的 Ubuntu 虚拟机
    timeout-minutes: 18        # 整个 job 最多运行 18 分钟，超时则强制终止

    steps:
      # 步骤1：检出仓库的指定分支
      - name: Checkout target branch
        uses: actions/checkout@v4   # 官方 checkout action
        with:
          ref: "2024/3"             # 切换到 2024/3 分支
          fetch-depth: 0            # 获取完整 git 历史（方便后续 diff 判断有无变更）

      # 步骤2：安装 Xray-core 最新版
      - name: Install Xray-core
        shell: bash
        run: |
          set -euo pipefail    # 严格模式：任何错误或未定义变量立即退出

          # 获取 Xray-core 最新 release 信息
          api="https://api.github.com/repos/XTLS/Xray-core/releases/latest"

          # 从 assets 中找出 Linux 64 位 zip 包的下载链接
          url=$(curl -fsSL "$api" | jq -r '.assets[].browser_download_url | select(test("Xray-linux-64.zip$"))' | head -n 1)
          test -n "$url"       # 确保链接非空

          # 下载并解压出 xray 可执行文件
          curl -fsSL "$url" -o /tmp/xray.zip
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip xray -d /tmp/xray

          # 安装到系统路径并显示版本
          sudo install /tmp/xray/xray /usr/local/bin/xray
          xray version

      # 步骤3：核心逻辑 – 用 Python 筛选最快的5个可靠节点
      - name: Select 5 fastest and most reliable nodes
        shell: bash
        run: |
          python3 <<'PY'
          import base64, json, pathlib, socket, statistics, subprocess, tempfile, time, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # 节点列表的远程地址（已 base64 编码）
          SOURCE = "https://raw.githubusercontent.com/Rnik666/-/refs/heads/2024/3/SSS"
          # 输出文件名，内容为 base64 编码的最佳节点列表
          TARGET = pathlib.Path("-Clash")
          # 需要筛选出的节点数量
          REQUIRED = 20
          # 用于测试连通性的目标网址及其期望的 HTTP 状态码
          TESTS = (
              ("https://www.gstatic.com/generate_204", "204"),
              ("https://cp.cloudflare.com/generate_204", "204"),
              ("https://www.google.com/generate_204", "204"),
          )
          # 每个节点重复测试的轮数
          ROUNDS = 3

          # 下载并解码节点列表（Base64 → 文本，去重）
          request = urllib.request.Request(SOURCE, headers={"User-Agent": "GitHub-Actions"})
          with urllib.request.urlopen(request, timeout=60) as response:
              encoded = response.read().strip()
          decoded = base64.b64decode(encoded, validate=True).decode("utf-8")
          nodes = list(dict.fromkeys(line.strip() for line in decoded.splitlines() if line.strip()))

          # 获取一个可用的本地端口
          def free_port():
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  return sock.getsockname()[1]

          # 测试单个节点：启动 Xray 代理，用 curl 通过代理访问所有测试网址，统计延迟
          def test_node(node):
              # 解析 Trojan 链接
              parsed = urllib.parse.urlsplit(node)
              if parsed.scheme != "trojan" or not parsed.hostname or not parsed.port or not parsed.username:
                  return None

              local_port = free_port()
              # Xray 配置：本地 SOCKS5 代理，出站为 Trojan + TLS
              config = {
                  "log": {"loglevel": "none"},
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",
                      "settings": {"udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "trojan",
                      "settings": {
                          "servers": [{
                              "address": parsed.hostname,
                              "port": parsed.port,
                              "password": urllib.parse.unquote(parsed.username)
                          }]
                      },
                      "streamSettings": {
                          "network": "tcp",
                          "security": "tls",
                          "tlsSettings": {
                              "serverName": parsed.hostname,
                              "allowInsecure": False
                          }
                      }
                  }]
              }

              # 临时目录中写入配置，启动 Xray
              with tempfile.TemporaryDirectory() as directory:
                  config_path = pathlib.Path(directory) / "config.json"
                  config_path.write_text(json.dumps(config), encoding="utf-8")
                  process = subprocess.Popen(
                      ["xray", "run", "-config", str(config_path)],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )
                  try:
                      time.sleep(0.45)   # 等待代理就绪
                      delays = []
                      for _ in range(ROUNDS):
                          for url, expected in TESTS:
                              started = time.monotonic()
                              result = subprocess.run(
                                  [
                                      "curl", "-fsS", "--max-time", "8",
                                      "--connect-timeout", "5",
                                      "--socks5-hostname", f"127.0.0.1:{local_port}",
                                      "-o", "/dev/null", "-w", "%{http_code}",
                                      url
                                  ],
                                  capture_output=True,
                                  text=True,
                                  timeout=10
                              )
                              # 必须返回期望的状态码才视为通过
                              if result.returncode != 0 or result.stdout.strip() != expected:
                                  return None
                              delays.append((time.monotonic() - started) * 1000)

                      # 计算性能指标
                      ordered = sorted(delays)
                      p90 = ordered[max(0, int(len(ordered) * 0.9) - 1)]   # 90分位延迟
                      median = statistics.median(delays)
                      jitter = statistics.pstdev(delays)                   # 抖动（标准差）
                      # 综合评分：p90 越短越好，抖动作为惩罚项（权重0.5）
                      score = p90 + jitter * 0.5
                      return score, median, p90, jitter, node
                  except (OSError, subprocess.TimeoutExpired):
                      return None
                  finally:
                      process.terminate()
                      try:
                          process.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          process.kill()

          results = []
          # 多线程并发测试所有节点（最多6个并发）
          with ThreadPoolExecutor(max_workers=6) as executor:
              futures = [executor.submit(test_node, node) for node in nodes]
              for future in as_completed(futures):
                  result = future.result()
                  if result:
                      results.append(result)
                      print(
                          f"Passed 9/9: median={result[1]:.0f} ms "
                          f"p90={result[2]:.0f} ms jitter={result[3]:.0f} ms",
                          flush=True
                      )

          # 按综合评分升序排列，分数越低越快/越稳
          results.sort(key=lambda item: item[0])
          if len(results) < REQUIRED:
              raise SystemExit(f"Only {len(results)} nodes passed all 9 proxy requests; {REQUIRED} required")

          # 取前5个节点，以换行分隔，再 Base64 编码写入文件
          selected = [item[4] for item in results[:REQUIRED]]
          output = "\n".join(selected) + "\n"
          TARGET.write_text(base64.b64encode(output.encode()).decode() + "\n", encoding="utf-8")
          print(f"Selected best {REQUIRED} of {len(results)} nodes that passed 9/9 requests")
          print(f"Selected score range: {results[0][0]:.0f}-{results[REQUIRED - 1][0]:.0f}")
          PY

      # 步骤4：将更新后的 -Clash 文件提交并推送到远程分支
      - name: Commit changes
        shell: bash
        run: |
          # 检查文件是否有变化
          if git diff --quiet -- "-Clash"; then
            echo "No changes"
            exit 0
          fi

          # 设置 git 用户身份（使用 GitHub Actions 机器人）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "-Clash"
          git commit -m "Update -Clash with Xray reliability tests"
          git push origin "HEAD:refs/heads/2024/3"