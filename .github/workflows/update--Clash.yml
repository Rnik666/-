# 工作流名称，显示在 Actions 页面name: Update -Clash# 定义触发条件on:  # 允许手动在 GitHub 上触发  workflow_dispatch:  # 定时触发：每小时的第12、32、52分运行一次（UTC时间）  schedule:    - cron: "7,27,47 * * * *"→ Runs at 12, 32, and 52 minutes past the hour# 赋予工作流写入仓库内容的权限（后续需要提交推送）permissions:  contents: write# 并发控制：同一时间只允许一个此工作流运行，新触发会取消正在运行的旧任务concurrency:  group: update--Clash  cancel-in-progress: truejobs:  update:                      # 唯一的 job，名称为 update    runs-on: ubuntu-latest     # 使用最新的 Ubuntu 虚拟机    timeout-minutes: 18        # 整个 job 最多运行 18 分钟，超时则强制终止    steps:      # 步骤1：检出仓库的指定分支      - name: Checkout target branch        uses: actions/checkout@v4   # 官方 checkout action        with:          ref: "2024/3"             # 切换到 2024/3 分支          fetch-depth: 0            # 获取完整 git 历史（方便后续 diff 判断有无变更）      # 步骤2：安装 Xray-core 最新版      - name: Install Xray-core        shell: bash  
