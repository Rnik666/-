name: Update WMZ-7on:  workflow_dispatch:  schedule:    - cron: "1,21,41 * * * *"→ Runs at 7, 27, and 47 minutes past the hourpermissions:  contents: writeconcurrency:  group: update-wmz-7  cancel-in-progress: truejobs:  update:    runs-on: ubuntu-latest    timeout-minutes: 18    steps:      - name: Checkout target branch        uses: actions/checkout@v4        with:          ref: "2024/3"          fetch-depth: 0      - name: Install sing-box        shell: bash        run: |          set -euo pipefail          api="https://api.github.com/repos/SagerNet/sing-box/releases/latest"          url=$(curl -fsSL "$api" | jq -r '.assets[].browser_download_url | select(test("linux-amd64.tar.gz$"))' | head -n 1)          test -n "$url"          curl -fsSL "$url" -o /tmp/sing-box.tar.gz          mkdir -p /tmp/sing-box          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box --strip-components=1          sudo install /tmp/sing-box/sing-box /usr/local/bin/sing-box  
