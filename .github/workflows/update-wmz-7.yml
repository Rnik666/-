name: Update WMZ-7

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-wmz-7
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 2024 branch
        uses: actions/checkout@v4
        with:
          ref: "2024"
          fetch-depth: 0

      - name: Extract 22 nodes
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import pathlib
          import urllib.request

          source_url = "https://raw.githubusercontent.com/Rnik666/-/refs/heads/2024/3/SSS"
          target = pathlib.Path("3/WMZ-7")

          request = urllib.request.Request(source_url, headers={"User-Agent": "GitHub-Actions"})
          with urllib.request.urlopen(request, timeout=60) as response:
              encoded = response.read().strip()

          try:
              decoded = base64.b64decode(encoded, validate=True).decode("utf-8")
          except Exception as error:
              raise SystemExit(f"Invalid Base64 subscription: {error}")

          nodes = [line.strip() for line in decoded.splitlines() if line.strip()]
          if len(nodes) < 22:
              raise SystemExit(f"Only {len(nodes)} nodes found; 22 required")

          output = "\n".join(nodes[:22]) + "\n"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(base64.b64encode(output.encode()).decode() + "\n", encoding="utf-8")
          print(f"Selected 22 of {len(nodes)} nodes")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- "3/WMZ-7"; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "3/WMZ-7"
          git commit -m "Auto update WMZ-7 nodes"
          git push origin HEAD:2024
