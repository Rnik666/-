name: Update zhi839033

on:
  workflow_dispatch:
  schedule:
    - cron: "12,32,52 * * * *"

permissions:
  contents: write

concurrency:
  group: update-zhi839033
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: "2024/3"
          fetch-depth: 0

      - name: Install Xray-core
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/XTLS/Xray-core/releases/latest"
          url=$(curl -fsSL "$api" | jq -r '.assets[].browser_download_url | select(test("Xray-linux-64.zip$"))' | head -n 1)
          test -n "$url"
          curl -fsSL "$url" -o /tmp/xray.zip
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          sudo install /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Select 5 fastest and most reliable nodes
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import json
          import pathlib
          import socket
          import statistics
          import subprocess
          import tempfile
          import time
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          SOURCE = "https://raw.githubusercontent.com/Rnik666/-/refs/heads/2024/3/SSS"
          TARGET = pathlib.Path("zhi839033")
          REQUIRED = 5
          TESTS = (
              ("https://www.gstatic.com/generate_204", "204"),
              ("https://cp.cloudflare.com/generate_204", "204"),
              ("https://www.google.com/generate_204", "204"),
          )
          ROUNDS = 3

          request = urllib.request.Request(SOURCE, headers={"User-Agent": "GitHub-Actions"})
          with urllib.request.urlopen(request, timeout=60) as response:
              encoded = response.read().strip()
          decoded = base64.b64decode(encoded, validate=True).decode("utf-8")
          nodes = list(dict.fromkeys(line.strip() for line in decoded.splitlines() if line.strip()))

          def free_port():
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  return sock.getsockname()[1]

          def test_node(node):
              parsed = urllib.parse.urlsplit(node)
              if parsed.scheme != "trojan" or not parsed.hostname or not parsed.port or not parsed.username:
                  return None

              local_port = free_port()
              config = {
                  "log": {"loglevel": "none"},
                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",
                      "settings": {"udp": False}
                  }],
                  "outbounds": [{
                      "protocol": "trojan",
                      "settings": {
                          "servers": [{
                              "address": parsed.hostname,
                              "port": parsed.port,
                              "password": urllib.parse.unquote(parsed.username)
                          }]
                      },
                      "streamSettings": {
                          "network": "tcp",
                          "security": "tls",
                          "tlsSettings": {
                              "serverName": parsed.hostname,
                              "allowInsecure": False
                          }
                      }
                  }]
              }

              with tempfile.TemporaryDirectory() as directory:
                  config_path = pathlib.Path(directory) / "config.json"
                  config_path.write_text(json.dumps(config), encoding="utf-8")
                  process = subprocess.Popen(
                      ["xray", "run", "-config", str(config_path)],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )
                  try:
                      time.sleep(0.45)
                      delays = []
                      for _ in range(ROUNDS):
                          for url, expected in TESTS:
                              started = time.monotonic()
                              result = subprocess.run(
                                  [
                                      "curl", "-fsS", "--max-time", "8",
                                      "--connect-timeout", "5",
                                      "--socks5-hostname", f"127.0.0.1:{local_port}",
                                      "-o", "/dev/null", "-w", "%{http_code}",
                                      url
                                  ],
                                  capture_output=True,
                                  text=True,
                                  timeout=10
                              )
                              if result.returncode != 0 or result.stdout.strip() != expected:
                                  return None
                              delays.append((time.monotonic() - started) * 1000)

                      ordered = sorted(delays)
                      p90 = ordered[max(0, int(len(ordered) * 0.9) - 1)]
                      median = statistics.median(delays)
                      jitter = statistics.pstdev(delays)
                      score = p90 + jitter * 0.5
                      return score, median, p90, jitter, node
                  except (OSError, subprocess.TimeoutExpired):
                      return None
                  finally:
                      process.terminate()
                      try:
                          process.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          process.kill()

          results = []
          with ThreadPoolExecutor(max_workers=6) as executor:
              futures = [executor.submit(test_node, node) for node in nodes]
              for future in as_completed(futures):
                  result = future.result()
                  if result:
                      results.append(result)
                      print(
                          f"Passed 9/9: median={result[1]:.0f} ms "
                          f"p90={result[2]:.0f} ms jitter={result[3]:.0f} ms",
                          flush=True
                      )

          results.sort(key=lambda item: item[0])
          if len(results) < REQUIRED:
              raise SystemExit(f"Only {len(results)} nodes passed all 9 proxy requests; {REQUIRED} required")

          selected = [item[4] for item in results[:REQUIRED]]
          output = "\n".join(selected) + "\n"
          TARGET.write_text(base64.b64encode(output.encode()).decode() + "\n", encoding="utf-8")
          print(f"Selected best {REQUIRED} of {len(results)} nodes that passed 9/9 requests")
          print(f"Selected score range: {results[0][0]:.0f}-{results[REQUIRED - 1][0]:.0f}")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- "zhi839033"; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "zhi839033"
          git commit -m "Update zhi839033 with Xray reliability tests"
          git push origin "HEAD:refs/heads/2024/3"
  
